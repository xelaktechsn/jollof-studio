# Miroir des fichiers de cartes Arduino du boîtier école (service « toolchain » de
# docker-compose.box.yml, image nginx sans privilèges, port 8080 dans le conteneur).
# Contenu préparé par toolchain/mirror.sh : index (package_jollof_index.json, library_index.json),
# archives des cartes et outils (packages/) et des bibliothèques (libraries/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # Carte SD : pas de journal des téléchargements, seulement les erreurs.
    access_log off;
    sendfile on;
    tcp_nopush on;

    # Liste des fichiers lisible dans un navigateur (vérification du miroir).
    autoindex on;
    autoindex_exact_size off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers cachés (sources des index, téléchargements en cours) : jamais servis.
    location ~ /\. {
        deny all;
    }

    # Index : relus à chaque mise à jour du miroir.
    location ~ \.json$ {
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/json;
    }

    # Archives : nom unique par version, jamais modifiées.
    location ~ ^/(packages|libraries)/ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
