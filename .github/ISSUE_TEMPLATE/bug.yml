name: Bug · Problème
description: Quelque chose ne marche pas comme prévu · Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe · What happens
      description: Et ce que vous attendiez · And what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire · Steps to reproduce
      description: Joignez le projet .jollof si possible · Attach the .jollof project if you can
  - type: input
    id: version
    attributes:
      label: Version et système · Version and system
      placeholder: "Jollof Studio 0.1.0, Windows 10"
