#
# Site de présentation (dossier site/, statique, bilingue) publié sur GitHub Pages à chaque poussée sur main qui le
# modifie, ou à la main (Actions → Site → Run workflow). Le site est publié tel quel ; la démonstration en ligne
# (l'édition libre de l'application, construite pour le navigateur) est ajoutée dans site/app/ : « Essayer dans le
# navigateur » y mène. Elle suit donc aussi les modifications de l'application. L'aide en ligne (site/aide/) est
# produite à partir de docs/GUIDE.md par scripts/help-site.mjs.
# Réglage du dépôt : Settings → Pages → Source = « GitHub Actions ».
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/GUIDE.md'
      - 'scripts/help-site.mjs'
      - 'scripts/help/**'
      - 'public/**'
      - 'exemples/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours n'est pas annulée.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le site (fichiers référencés présents)
        run: |
          set -e
          cd site
          missing=0
          for f in $(grep -oE '(src|href|poster)="assets/[^"]+"' index.html | sed -E 's/^[a-z]+="//; s/"$//' | sort -u); do
            [ -f "$f" ] || { echo "manquant : $f"; missing=1; }
          done
          for l in fr en; do
            for f in assets/video/jollof-$l.mp4 assets/img/poster-$l.jpg; do [ -f "$f" ] || { echo "manquant : $f"; missing=1; }; done
            for s in $(grep -oE 'data-img="[a-z]+"' index.html | sed -E 's/data-img="//; s/"//' | sort -u); do
              [ -f "assets/img/$s-$l.jpg" ] || { echo "manquant : assets/img/$s-$l.jpg"; missing=1; }
            done
          done
          exit $missing
      # Démonstration en ligne : chemins relatifs (--base=./), elle fonctionne dans n'importe quel sous-dossier.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire la démonstration en ligne (site/app)
        run: npx vite build --base=./ --outDir site/app --emptyOutDir
      # Aide en ligne : docs/GUIDE.md découpé en pages statiques avec recherche (site/aide), sans dépendance.
      - name: Construire le site d'aide (site/aide)
        run: node scripts/help-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
