[package]
name = "jollof-studio"
version = "0.1.0"
description = "Jollof Studio : conception et animation de circuits électroniques en 3D"
authors = ["Mamadou Sarr"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "jollof_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
percent-encoding = "2"
# Déjà utilisé par Tauri (même version, mêmes options) : `block_in_place` pour écrire sans copie
# les gros corps binaires reçus de la webview.
tokio = { version = "1", features = ["rt-multi-thread"] }
# Carte réelle en USB (simulation avec du vrai matériel, protocole Firmata).
serialport = "4"
# Mode fidèle de l'ESP32 : téléchargement de l'émulateur (QEMU, programme à part) à la première utilisation,
# vérification de son empreinte et décompression.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Supervision MA-ISA du circuit simulé : caisse locale sans Tauri, bâtie sur la caisse publiée maisa-core
# (crates.io), utilisée telle quelle.
jollof-supervision = { path = "supervision" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
